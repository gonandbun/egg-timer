<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ゆで卵タイマー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      background: #1a1a2e;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 24px;
      opacity: 0.9;
      letter-spacing: 0.05em;
    }

    .steps {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
      width: 100%;
      max-width: 360px;
    }

    .step-dot {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: rgba(255,255,255,0.15);
      transition: background 0.4s;
    }

    .step-dot.active { background: #f0a500; }
    .step-dot.done { background: #4caf82; }

    .timer-circle {
      position: relative;
      width: 260px;
      height: 260px;
      margin-bottom: 28px;
    }

    .timer-circle svg {
      transform: rotate(-90deg);
      width: 260px;
      height: 260px;
    }

    .track { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 12; }
    .progress {
      fill: none;
      stroke: #f0a500;
      stroke-width: 12;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear, stroke 0.4s;
    }

    .timer-info {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .time-display {
      font-size: 3.2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .step-label {
      font-size: 0.8rem;
      opacity: 0.65;
      margin-top: 8px;
    }

    .step-desc {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 28px;
      text-align: center;
      min-height: 1.4em;
      color: #f0c060;
    }

    .controls {
      display: flex;
      gap: 16px;
    }

    button {
      border: none;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      padding: 16px 36px;
      transition: opacity 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    button:active { transform: scale(0.95); opacity: 0.8; }

    #btn-main {
      background: #f0a500;
      color: #1a1a2e;
      min-width: 140px;
    }

    #btn-reset {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }

    .all-done {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
    }

    .all-done .egg { font-size: 5rem; }
    .all-done p { font-size: 1.3rem; font-weight: 700; color: #f0c060; }
    .all-done small { opacity: 0.6; font-size: 0.85rem; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<h1>🥚 ゆで卵タイマー</h1>

<div id="main">
  <div class="steps">
    <div class="step-dot" id="dot0"></div>
    <div class="step-dot" id="dot1"></div>
    <div class="step-dot" id="dot2"></div>
  </div>

  <div class="timer-circle">
    <svg viewBox="0 0 260 260">
      <circle class="track" cx="130" cy="130" r="114"/>
      <circle class="progress" id="ring" cx="130" cy="130" r="114"/>
    </svg>
    <div class="timer-info">
      <div class="time-display" id="time">2:30</div>
      <div class="step-label" id="step-num">ステップ 1 / 3</div>
    </div>
  </div>

  <div class="step-desc" id="step-desc">火にかける（沸騰まで）</div>

  <div class="controls">
    <button id="btn-reset" onclick="reset()">リセット</button>
    <button id="btn-main" onclick="toggle()">スタート</button>
  </div>
</div>

<div class="all-done" id="done">
  <div class="egg">🥚</div>
  <p>できあがり！</p>
  <small>ゆで卵が完成しました</small>
  <button onclick="reset()" style="margin-top:12px; background:#f0a500; color:#1a1a2e;">もう一度</button>
</div>

<script>
  const STEPS = [
    { label: '火にかける（沸騰まで）', total: 150, color: '#f0a500' },
    { label: '弱火で加熱',             total: 240, color: '#e05c3a' },
    { label: '蒸らし',                 total: 600, color: '#4caf82' },
  ];

  const CIRC = 2 * Math.PI * 114;

  const ring      = document.getElementById('ring');
  const timeEl    = document.getElementById('time');
  const stepNum   = document.getElementById('step-num');
  const stepDesc  = document.getElementById('step-desc');
  const btnMain   = document.getElementById('btn-main');

  ring.style.strokeDasharray = CIRC;

  let step = 0, remaining = STEPS[0].total, running = false, tid = null;

  // Notification permission
  if ('Notification' in window) Notification.requestPermission();

  function fmt(s) {
    const m = Math.floor(s / 60), sec = s % 60;
    return `${m}:${String(sec).padStart(2,'0')}`;
  }

  function render() {
    const st = STEPS[step];
    timeEl.textContent = fmt(remaining);
    stepNum.textContent = `ステップ ${step+1} / 3`;
    stepDesc.textContent = st.label;
    ring.style.stroke = st.color;
    const frac = remaining / st.total;
    ring.style.strokeDashoffset = CIRC * (1 - frac);

    for (let i = 0; i < 3; i++) {
      const d = document.getElementById('dot' + i);
      d.className = 'step-dot' + (i < step ? ' done' : i === step ? ' active' : '');
    }
  }

  let alarmInterval = null;

  function notify(msg) {
    try {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('ゆで卵タイマー', { body: msg, icon: '🥚' });
      }
    } catch(e) {}
    try { navigator.vibrate && navigator.vibrate([600, 200, 600, 200, 600]); } catch(e) {}
    startAlarm();
  }

  function startAlarm() {
    stopAlarm();
    let elapsed = 0;
    beep();
    alarmInterval = setInterval(() => {
      elapsed += 1.5;
      if (elapsed >= 30) { stopAlarm(); return; }
      beep();
    }, 1500);
  }

  function stopAlarm() {
    if (alarmInterval) { clearInterval(alarmInterval); alarmInterval = null; }
  }

  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -6;
      comp.ratio.value = 20;
      comp.connect(ctx.destination);

      [0, 0.45, 0.9].forEach(t => {
        // 複数の周波数を重ねて音圧を上げる
        [440, 880, 1320].forEach(freq => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g); g.connect(comp);
          o.frequency.value = freq;
          o.type = 'square';
          g.gain.setValueAtTime(1.5, ctx.currentTime + t);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.4);
          o.start(ctx.currentTime + t);
          o.stop(ctx.currentTime + t + 0.4);
        });
      });
    } catch(e) {}
  }

  function tick() {
    remaining--;
    if (remaining <= 0) {
      if (step < 2) {
        const messages = ['沸騰しました！弱火にしてください🔥', '火を止めてください！蒸らし開始🍳'];
        notify(messages[step]);
        step++;
        remaining = STEPS[step].total;
        render();
      } else {
        running = false;
        clearInterval(tid);
        btnMain.textContent = 'スタート';
        notify('ゆで卵のできあがり！🥚');
        document.getElementById('main').style.display = 'none';
        const doneEl = document.getElementById('done');
        doneEl.style.display = 'flex';
        return;
      }
    }
    render();
  }

  function toggle() {
    if (running) {
      running = false;
      clearInterval(tid);
      btnMain.textContent = 'スタート';
    } else {
      running = true;
      tid = setInterval(tick, 1000);
      btnMain.textContent = '一時停止';
    }
  }

  function reset() {
    running = false;
    clearInterval(tid);
    step = 0;
    remaining = STEPS[0].total;
    btnMain.textContent = 'スタート';
    document.getElementById('main').style.display = '';
    document.getElementById('done').style.display = 'none';
    render();
  }

  render();
</script>
</body>
</html>
